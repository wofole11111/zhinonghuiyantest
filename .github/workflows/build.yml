name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Update package list
        run: sudo apt update
      
      - name: Install Java
        run: sudo apt install -y openjdk-17-jdk
      
      - name: Install build tools
        run: sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      
      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel
      
      - name: Install cython
        run: pip install cython
      
      - name: Install buildozer
        run: pip install buildozer
      
      - name: Build APK
        run: buildozer android debug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
